name: Auto-Evolve Website

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install google-generativeai

      - name: Run Evolve Script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python evolve.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'Chimera-Bot'
          git config --global user.email 'chimera@bot.com'
          git add index.html
          git commit -m "Build: Project Chimera - Generation Evolved" || echo "No changes to commit"
          git push
