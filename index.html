<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Project Chimera - 第 8.5 代</title> <!-- 世代數字已進化至 8.5 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='0' y='14'>🧬</text></svg>" type="image/svg+xml">
    <style>
        /* CSS Variables for easier theme switching - 2.5 世代優化 */
        :root {
            /* 暗色主題：更深邃、流動的漸變 */
            --bg-start: #1A2A6C; /* Deep Indigo */
            --bg-mid: #B21F1F;   /* Fiery Red */
            --bg-end: #FDBB2D;   /* Golden Yellow */
            --body-bg-fallback: #10101a;
            --text-color: #f0f0f0;
            --container-bg: rgba(255, 255, 255, 0.08); /* 更透明的毛玻璃 */
            --container-border: rgba(255, 255, 255, 0.15); /* 更微妙的邊框 */
            --container-shadow: rgba(0, 0, 0, 0.7); /* 更深邃的陰影 */
            --status-text-shadow: rgba(255, 255, 255, 0.4); /* 更微妙的文字陰影 */
            --particle-color: 255, 255, 255; /* RGB values for particles */
            --theme-toggle-color: #e0e0e0;
            --theme-toggle-hover-color: #ffffff;
            --clock-text-color: #E0E0E0; /* 時鐘文字顏色 */
            --clock-shadow-color: rgba(255, 255, 255, 0.2); /* 時鐘文字陰影 */
            --clock-bg-color: rgba(0, 0, 0, 0.3); /* 時鐘背景 */
            --clock-border-color: rgba(255, 255, 255, 0.1); /* 時鐘邊框 */
        }

        /* 亮色主題：明亮、清新的漸變 */
        body.light-theme {
            --bg-start: #FCEABB; /* Soft Peach */
            --bg-mid: #F8B500;   /* Sunny Yellow */
            --bg-end: #FBDA61;   /* Goldenrod */
            --body-bg-fallback: #f8f8f8;
            --text-color: #222222;
            --container-bg: rgba(255, 255, 255, 0.75);
            --container-border: rgba(0, 0, 0, 0.1);
            --container-shadow: rgba(0, 0, 0, 0.3);
            --status-text-shadow: rgba(0, 0, 0, 0.1);
            --particle-color: 0, 0, 0; /* RGB values for dark particles */
            --theme-toggle-color: #333333;
            --theme-toggle-hover-color: #000000;
            --clock-text-color: #333333;
            --clock-shadow-color: rgba(0, 0, 0, 0.1);
            --clock-bg-color: rgba(255, 255, 255, 0.5);
            --clock-border-color: rgba(0, 0, 0, 0.05);
        }

        /* 全局設定與字體 */
        body {
            background-color: var(--body-bg-fallback);
            color: var(--text-color);
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* 防止滾動條 */
            box-sizing: border-box;
            line-height: 1.6;
            transition: background-color 1s ease-in-out, color 1s ease-in-out; /* 更流暢的主題切換 */
        }

        /* 動態流體背景 - 2.5 世代：更慢、更廣、更模糊 */
        .fluid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, var(--bg-start), var(--bg-mid), var(--bg-end)); /* 調整角度 */
            background-size: 600% 600%; /* 更大的背景尺寸，實現更慢的流動感 */
            animation: gradientShift 32s ease infinite alternate, hueRotate 50s linear infinite; /* 調整動畫速度，更慢 */
            z-index: -3;
            opacity: 0.9; /* 增加不透明度以展現更豐富的色彩 */
            filter: blur(30px); /* 略微增加模糊度，更深邃 */
            transition: background 1s ease-in-out, filter 1s ease-in-out, opacity 1s ease-in-out;
        }

        /* 漸變位置動畫 */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 色相旋轉動畫 */
        @keyframes hueRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* 2.5 世代：抽象粒子效果 Canvas */
        #subtle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            opacity: 0.9; /* 更為明顯但依然微妙的效果 */
            transition: opacity 1s ease;
        }

        /* 主內容容器：精緻的毛玻璃效果 - 2.5 世代優化 */
        #container {
            background-color: var(--container-bg);
            backdrop-filter: blur(35px) saturate(2.5); /* 更深的模糊和更高的飽和度 */
            -webkit-backdrop-filter: blur(35px) saturate(2.5);
            border: 1px solid var(--container-border);
            border-radius: 40px; /* 更圓潤的邊角 */
            padding: 55px;
            box-shadow: 0 20px 70px 0 var(--container-shadow); /* 更明顯、更深邃的陰影 */
            text-align: center;
            max-width: 800px; /* 略微增加最大寬度 */
            width: 90%;
            margin: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 40px; /* 略微增加間距 */
            transition: background-color 1s ease-in-out, border 1s ease-in-out, box-shadow 1s ease-in-out, color 1s ease-in-out, backdrop-filter 1s ease-in-out;
            animation: fadeIn 1.2s ease-out forwards; /* 容器淡入動畫 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #status {
            font-size: 3em; /* 略微放大字體 */
            font-weight: 800; /* 更粗的字重 */
            line-height: 1.4;
            text-shadow: 0 0 20px var(--status-text-shadow); /* 更明顯的文字陰影 */
            margin-bottom: 30px;
            transition: text-shadow 1s ease-in-out, color 1s ease-in-out;
            letter-spacing: 0.08em; /* 略微增加字元間距 */
            background: linear-gradient(45deg, var(--text-color), var(--theme-toggle-color)); /* 文字漸變 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 2.5 世代：主題切換按鈕 - 更精緻的交互 */
        #theme-toggle {
            position: absolute;
            top: 40px; /* 略微增加上邊距 */
            right: 40px; /* 略微增加右邊距 */
            background: none;
            border: none;
            cursor: pointer;
            padding: 15px; /* 增加點擊區域 */
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.4s ease;
        }

        #theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.18); /* 懸停時的背景光暈 */
        }

        #theme-toggle svg {
            width: 38px; /* 略微放大圖標 */
            height: 38px;
            fill: var(--theme-toggle-color);
            transition: fill 0.4s ease, transform 0.3s ease;
        }

        #theme-toggle:hover svg {
            fill: var(--theme-toggle-hover-color);
            transform: rotate(30deg) scale(1.2); /* 懸停時 subtle 旋轉和縮放 */
        }

        /* 2.5 世代：進化時鐘 - Dynamic Evolutionary Clock */
        #evolutionary-clock {
            font-family: 'Roboto Mono', monospace; /* 使用等寬字體 */
            font-size: 4.5em; /* 顯著的時鐘字體大小 */
            font-weight: 600;
            color: var(--clock-text-color);
            letter-spacing: 0.1em; /* 增加字元間距 */
            text-shadow: 0 0 15px var(--clock-shadow-color), 0 0 30px rgba(var(--particle-color), 0.3); /* 多層次陰影 */
            background: var(--clock-bg-color);
            border: 1px solid var(--clock-border-color);
            padding: 30px 40px;
            border-radius: 25px;
            margin-top: 20px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2), 0 5px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 150px; /* 確保有足夠高度 */
            transition: all 1s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        #evolutionary-clock::before { /* 閃爍點綴 */
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(var(--particle-color), 0.1) 0%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            animation: pulse-light 10s infinite ease-out;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes pulse-light {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        .clock-digit {
            min-width: 0.8em; /* 確保每個數字有足夠寬度 */
            display: inline-block;
            transition: color 0.5s ease-in-out;
        }

        /* 響應式調整 */
        @media (max-width: 768px) {
            #status {
                font-size: 2.5em;
            }
            #container {
                padding: 50px;
                gap: 35px;
                border-radius: 35px;
            }
            #theme-toggle {
                top: 35px;
                right: 35px;
                padding: 12px;
            }
            #theme-toggle svg {
                width: 34px;
                height: 34px;
            }
            .fluid-background {
                filter: blur(25px);
            }
            #subtle-canvas {
                opacity: 0.75;
            }
            #evolutionary-clock {
                font-size: 3.5em;
                padding: 25px 30px;
                min-height: 130px;
            }
        }

        @media (max-width: 480px) {
            #status {
                font-size: 2em;
                letter-spacing: 0.06em;
            }
            #container {
                padding: 40px;
                gap: 30px;
                border-radius: 30px;
            }
            #theme-toggle {
                top: 30px;
                right: 30px;
                padding: 10px;
            }
            #theme-toggle svg {
                width: 30px;
                height: 30px;
            }
            .fluid-background {
                filter: blur(20px);
            }
            #subtle-canvas {
                opacity: 0.6;
            }
            #evolutionary-clock {
                font-size: 2.8em;
                padding: 20px 25px;
                min-height: 110px;
                letter-spacing: 0.08em;
            }
        }
    </style>
    <!-- 導入 Google Fonts 的 Inter 和 Roboto Mono 字體，用於現代設計風格和時鐘 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 動態流體背景層 -->
    <div class="fluid-background"></div>

    <!-- 2.5 世代：微妙的抽象粒子效果 Canvas -->
    <canvas id="subtle-canvas"></canvas>

    <!-- 主內容容器 -->
    <div id="container">
        <!-- 2.5 世代：主題切換按鈕 -->
        <button id="theme-toggle" aria-label="Toggle theme">
            <!-- 月亮圖標 (預設暗色主題) -->
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <!-- 太陽圖標 (亮色主題) -->
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>

        <!-- 世代記錄：數字加 1 -->
        <div id="status">這是 Project Chimera 的第 8.5 代。<br>數位維度的時間正在流逝...</div> <!-- 世代數字已進化至 8.5 -->

        <!-- 2.5 世代功能：進化時鐘 (Dynamic Evolutionary Clock) -->
        <div id="evolutionary-clock">
            <span class="clock-digit" id="hours">00</span>
            <span class="clock-digit">:</span>
            <span class="clock-digit" id="minutes">00</span>
            <span class="clock-digit">:</span>
            <span class="clock-digit" id="seconds">00</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const themeToggle = document.getElementById('theme-toggle');
            const moonIcon = themeToggle.querySelector('.moon-icon');
            const sunIcon = themeToggle.querySelector('.sun-icon');
            const hoursSpan = document.getElementById('hours');
            const minutesSpan = document.getElementById('minutes');
            const secondsSpan = document.getElementById('seconds');

            // --- 2.5 世代：主題切換功能 ---
            function toggleTheme() {
                if (body.classList.contains('light-theme')) {
                    body.classList.remove('light-theme');
                    moonIcon.style.display = 'block';
                    sunIcon.style.display = 'none';
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.classList.add('light-theme');
                    moonIcon.style.display = 'none';
                    sunIcon.style.display = 'block';
                    localStorage.setItem('theme', 'light');
                }
                // 當主題切換時，強制更新粒子顏色
                updateParticleColorInCanvas(); 
            }

            themeToggle.addEventListener('click', toggleTheme);

            // 根據用戶偏好或上次選擇設置主題
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'light') {
                body.classList.add('light-theme');
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else if (savedTheme === 'dark') {
                body.classList.remove('light-theme');
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            } else if (!prefersDark && savedTheme === null) { // 如果沒有保存的偏好且系統偏好亮色主題 (初次訪問)
                body.classList.add('light-theme');
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else { // 預設為暗色主題 (系統偏好暗色或無偏好且未保存)
                body.classList.remove('light-theme');
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            }


            // --- 2.5 世代：Canvas 抽象粒子效果 ---
            const canvas = document.getElementById('subtle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const particleCount = 300; // 增加粒子數量以產生更豐富的效果

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            let particleBaseColorRGB = "255, 255, 255"; // 初始值，由主題更新

            function updateParticleColorInCanvas() {
                const rootStyles = getComputedStyle(document.documentElement);
                particleBaseColorRGB = rootStyles.getPropertyValue('--particle-color').trim();
            }
            // 載入時呼叫一次以設定初始顏色
            updateParticleColorInCanvas();

            class Particle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2.8 + 0.7; // 粒子大小範圍 0.7 到 3.5
                    this.speedX = Math.random() * 0.9 - 0.45; // 粒子水平速度 -0.45 到 0.45
                    this.speedY = Math.random() * 0.9 - 0.45; // 粒子垂直速度 -0.45 到 0.45
                    this.opacity = Math.random() * 0.9 + 0.1; // 初始不透明度，略微可見
                    this.fadeSpeed = Math.random() * 0.0035 + 0.0015; // 更慢的淡出速度
                    this.growShrinkSpeed = (Math.random() * 0.012 - 0.006); // 微妙的粒子膨脹/收縮效果
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.opacity -= this.fadeSpeed;
                    this.size += this.growShrinkSpeed;

                    // 確保粒子大小在合理範圍內並反轉方向
                    if (this.size < 0.7 || this.size > 3.5) {
                        this.growShrinkSpeed *= -1;
                    }

                    // 如果粒子淡出或超出螢幕，則重置它
                    if (this.opacity <= 0 || this.x < -this.size * 2 || this.x > canvas.width + this.size * 2 || this.y < -this.size * 2 || this.y > canvas.height + this.size * 2) {
                        this.reset();
                        this.opacity = Math.random() * 0.9 + 0.1; // 重生時帶有變化的不透明度
                    }
                }

                draw() { // baseColorRGB 現在是全域變數，動態更新
                    ctx.fillStyle = `rgba(${particleBaseColorRGB}, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initParticles() {
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); // 清除畫布

                ctx.globalCompositeOperation = 'lighter'; // 讓粒子發光並融合 (更亮的像素)

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw(); // 現在無需傳入參數
                }
                requestAnimationFrame(animateParticles);
            }

            initParticles();
            animateParticles();

            // --- 2.5 世代：進化時鐘功能 (Dynamic Evolutionary Clock) ---
            function updateClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');

                hoursSpan.textContent = hours;
                minutesSpan.textContent = minutes;
                secondsSpan.textContent = seconds;
            }

            // 首次呼叫並設定定時器進行更新
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>
