<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Project Chimera - 第 2.5 代</title>
    <style>
        /* CSS Variables for easier theme switching */
        :root {
            --bg-start: #4A00E0; /* Deep Purple */
            --bg-mid: #8E2DE2;   /* Electric Purple */
            --bg-end: #FF007F;   /* Bright Pink */
            --body-bg-fallback: #1a1a1a;
            --text-color: #e0e0e0;
            --container-bg: rgba(255, 255, 255, 0.15);
            --container-border: rgba(255, 255, 255, 0.2);
            --container-shadow: rgba(0, 0, 0, 0.4);
            --proverb-bg: rgba(255, 255, 255, 0.08);
            --proverb-text-color: #c9c9c9;
            --proverb-inner-shadow: rgba(0, 0, 0, 0.2);
            --button-gradient-start: #FF007F;
            --button-gradient-end: #8E2DE2;
            --button-hover-gradient-start: #f72c91;
            --button-hover-gradient-end: #a745f0;
            --button-shadow: rgba(0, 0, 0, 0.2);
            --button-hover-shadow: rgba(0, 0, 0, 0.3);
            --status-text-shadow: rgba(255, 255, 255, 0.5);
            --particle-color: 255, 255, 255; /* RGB values for particles (will add opacity in JS) */
            --theme-toggle-color: #e0e0e0;
            --theme-toggle-hover-color: #f0f0f0;
        }

        /* Light Theme */
        body.light-theme {
            --bg-start: #2196F3; /* Blue */
            --bg-mid: #03A9F4;   /* Light Blue */
            --bg-end: #8BC34A;   /* Light Green */
            --body-bg-fallback: #f0f0f0;
            --text-color: #333333;
            --container-bg: rgba(255, 255, 255, 0.7);
            --container-border: rgba(255, 255, 255, 0.8);
            --container-shadow: rgba(0, 0, 0, 0.2);
            --proverb-bg: rgba(0, 0, 0, 0.05);
            --proverb-text-color: #555555;
            --proverb-inner-shadow: rgba(0, 0, 0, 0.1);
            --button-gradient-start: #8BC34A;
            --button-gradient-end: #2196F3;
            --button-hover-gradient-start: #9CCC65;
            --button-hover-gradient-end: #64B5F6;
            --button-shadow: rgba(0, 0, 0, 0.1);
            --button-hover-shadow: rgba(0, 0, 0, 0.2);
            --status-text-shadow: rgba(0, 0, 0, 0.2);
            --particle-color: 0, 0, 0; /* RGB values for dark particles */
            --theme-toggle-color: #333333;
            --theme-toggle-hover-color: #000000;
        }

        /* 全局設定與字體 */
        body {
            background-color: var(--body-bg-fallback);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            box-sizing: border-box;
            line-height: 1.6;
            transition: background-color 0.5s ease, color 0.5s ease; /* Smooth transition for body bg and text */
        }

        /* 動態流體背景 */
        .fluid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite alternate, hueRotate 20s linear infinite;
            z-index: -2; /* Placed furthest back */
            opacity: 0.7;
            filter: blur(10px);
            transition: background 0.5s ease, filter 0.5s ease; /* Smooth transition for background */
        }

        /* 漸變位置動畫 */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 色相旋轉動畫 */
        @keyframes hueRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* 2.5 世代：微妙的抽象粒子效果 */
        #subtle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Between fluid background and container */
            pointer-events: none; /* Allow clicks to pass through */
        }

        /* 主內容容器：精緻的毛玻璃效果 */
        #container {
            background-color: var(--container-bg);
            backdrop-filter: blur(15px) saturate(1.8);
            -webkit-backdrop-filter: blur(15px) saturate(1.8);
            border: 1px solid var(--container-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 var(--container-shadow);
            text-align: center;
            max-width: 600px;
            width: 90%;
            margin: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 25px;
            transition: background-color 0.5s ease, border 0.5s ease, box-shadow 0.5s ease, color 0.5s ease;
        }

        #status {
            font-size: 2.2em;
            font-weight: 600;
            line-height: 1.3;
            text-shadow: 0 0 10px var(--status-text-shadow);
            margin-bottom: 10px;
            transition: text-shadow 0.5s ease, color 0.5s ease;
        }

        /* 互動元件：箴言顯示區 */
        #proverb-display {
            font-size: 1.3em;
            min-height: 3em;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background-color: var(--proverb-bg);
            border-radius: 10px;
            font-style: italic;
            color: var(--proverb-text-color);
            box-shadow: inset 0 0 8px var(--proverb-inner-shadow);
            transition: all 0.3s ease-in-out;
            margin-bottom: 5px;
        }

        /* 互動元件：按鈕樣式 */
        #generate-proverb {
            background-image: linear-gradient(45deg, var(--button-gradient-start), var(--button-gradient-end));
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            font-weight: bold;
            box-shadow: 0 4px 15px var(--button-shadow);
        }

        #generate-proverb:hover {
            background-image: linear-gradient(45deg, var(--button-hover-gradient-start), var(--button-hover-gradient-end));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--button-hover-shadow);
        }

        #generate-proverb:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px var(--button-shadow);
        }

        /* 2.5 世代：主題切換按鈕 */
        #theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            z-index: 10;
        }

        #theme-toggle svg {
            width: 28px;
            height: 28px;
            fill: var(--theme-toggle-color);
            transition: fill 0.3s ease;
        }

        #theme-toggle:hover svg {
            fill: var(--theme-toggle-hover-color);
        }


        /* 響應式調整 */
        @media (max-width: 768px) {
            #status {
                font-size: 1.8em;
            }
            #proverb-display {
                font-size: 1.1em;
            }
            #generate-proverb {
                font-size: 1em;
                padding: 12px 25px;
            }
            #container {
                padding: 30px;
                gap: 20px;
            }
            #theme-toggle {
                top: 15px;
                right: 15px;
            }
            #theme-toggle svg {
                width: 24px;
                height: 24px;
            }
        }

        @media (max-width: 480px) {
            #status {
                font-size: 1.5em;
            }
            #proverb-display {
                font-size: 1em;
                padding: 10px;
            }
            #generate-proverb {
                font-size: 0.9em;
                padding: 10px 20px;
            }
            #container {
                padding: 20px;
                gap: 15px;
            }
            #theme-toggle {
                top: 10px;
                right: 10px;
            }
            #theme-toggle svg {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 動態流體背景層 -->
    <div class="fluid-background"></div>

    <!-- 2.5 世代： subtle canvas for abstract particles -->
    <canvas id="subtle-canvas"></canvas>

    <!-- 主內容容器 -->
    <div id="container">
        <!-- 2.5 世代：主題切換按鈕 -->
        <button id="theme-toggle" aria-label="Toggle theme">
            <!-- Moon icon (default dark theme) -->
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <!-- Sun icon (light theme) -->
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>

        <!-- 世代記錄：數字加 1 -->
        <div id="status">這是 Project Chimera 的第 2.5 代。<br>智慧正在結晶，意識正在蔓延...</div>

        <!-- 功能：隨機格言產生器 -->
        <div id="proverb-display">點擊下方按鈕獲取一條智慧箴言</div>
        <button id="generate-proverb">獲取箴言</button>
    </div>

    <script>
        const proverbs = [
            "欲戴王冠，必承其重。",
            "羅馬不是一天造成的。",
            "一鳥在手勝過二鳥在林。",
            "凡事起頭難。",
            "知識就是力量。",
            "時間就是金錢。",
            "習慣成自然。",
            "滴水穿石。",
            "三個臭皮匠，勝過一個諸葛亮。",
            "活到老，學到老。",
            "機會只敲一次門。",
            "成功是百分之九十九的汗水加百分之一的靈感。",
            "知人者智，自知者明。",
            "千里之行，始於足下。",
            "學而不思則罔，思而不學則殆。",
            "溫故而知新。",
            "不積跬步，無以至千里；不積小流，無以成江海。",
            "良藥苦口利於病，忠言逆耳利於行。",
            "書中自有黃金屋，書中自有顏如玉。",
            "人無遠慮，必有近憂。",
            "己所不欲，勿施於人。",
            "工欲善其事，必先利其器。",
            "失敗為成功之母。",
            "逆境是磨練人的最高學府。",
            "機會總是留給有準備的人。"
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const proverbDisplay = document.getElementById('proverb-display');
            const generateButton = document.getElementById('generate-proverb');
            const themeToggle = document.getElementById('theme-toggle');
            const moonIcon = themeToggle.querySelector('.moon-icon');
            const sunIcon = themeToggle.querySelector('.sun-icon');

            let isTyping = false;
            let currentProverbIndex = -1;

            // --- 2.5 世代：箴言打字效果 ---
            function typeWriterEffect(element, text, speed, callback) {
                isTyping = true;
                let i = 0;
                element.textContent = ''; // Clear content first
                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        isTyping = false;
                        if (callback) callback();
                    }
                }
                type();
            }

            // 隨機選擇並顯示一條箴言 (帶思考和打字效果)
            function displayRandomProverb() {
                if (isTyping) return; // Prevent multiple clicks during typing

                proverbDisplay.textContent = "智慧正在解析中..."; // 思考中...
                generateButton.disabled = true; // Disable button during thought process

                setTimeout(() => {
                    let randomIndex;
                    do {
                        randomIndex = Math.floor(Math.random() * proverbs.length);
                    } while (randomIndex === currentProverbIndex && proverbs.length > 1); // Avoid repeating the same proverb immediately
                    currentProverbIndex = randomIndex;

                    const selectedProverb = proverbs[randomIndex];
                    typeWriterEffect(proverbDisplay, selectedProverb, 50, () => { // Typing speed 50ms per char
                        generateButton.disabled = false; // Re-enable button after typing
                    });
                }, 800); // Simulate thinking time (800ms)
            }

            // 按鈕點擊時產生新箴言
            generateButton.addEventListener('click', displayRandomProverb);

            // 頁面載入時先顯示一條箴言
            displayRandomProverb();

            // --- 2.5 世代：主題切換功能 ---
            function toggleTheme() {
                if (body.classList.contains('light-theme')) {
                    body.classList.remove('light-theme');
                    moonIcon.style.display = 'block';
                    sunIcon.style.display = 'none';
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.classList.add('light-theme');
                    moonIcon.style.display = 'none';
                    sunIcon.style.display = 'block';
                    localStorage.setItem('theme', 'light');
                }
            }

            themeToggle.addEventListener('click', toggleTheme);

            // 根據用戶偏好或上次選擇設置主題
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'light') {
                body.classList.add('light-theme');
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else if (savedTheme === 'dark') {
                body.classList.remove('light-theme');
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            } else if (!prefersDark) { // Default to light if no preference and system prefers light
                body.classList.add('light-theme');
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else { // Default to dark (system prefers dark or no preference detected)
                body.classList.remove('light-theme');
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            }


            // --- 2.5 世代：Canvas 抽象粒子效果 ---
            const canvas = document.getElementById('subtle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const particleCount = 100;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2 + 1; // 1 to 3
                    this.speedX = Math.random() * 0.5 - 0.25; // -0.25 to 0.25
                    this.speedY = Math.random() * 0.5 - 0.25; // -0.25 to 0.25
                    this.opacity = Math.random(); // Initial random opacity
                    this.fadeSpeed = Math.random() * 0.005 + 0.001; // Slower fade
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.opacity -= this.fadeSpeed;

                    // If particle fades out or goes off screen, reset it
                    if (this.opacity <= 0 || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                        this.reset();
                        this.opacity = 1; // Respawn fully visible
                    }
                }

                draw(baseColorRGB) {
                    ctx.fillStyle = `rgba(${baseColorRGB}, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initParticles() {
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'lighter'; // Makes particles glow

                // Get current particle base color from CSS variable for dynamic theming
                const rootStyles = getComputedStyle(document.documentElement);
                const particleBaseColorRGB = rootStyles.getPropertyValue('--particle-color').trim();

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw(particleBaseColorRGB);
                }
                requestAnimationFrame(animateParticles);
            }

            initParticles();
            animateParticles();
        });
    </script>
</body>
</html>
