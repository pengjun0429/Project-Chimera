    <style>
        :root {

            --primary-glow: rgba(100, 200, 255, 0.99); /* Brighter Cyan-blue glow */
            --secondary-glow: rgba(255, 120, 200, 0.95); /* Vibrant Pink glow */
            --tertiary-glow: rgba(80, 255, 80, 0.99); /* Electrifying Green glow */

            --text-color: #E8E8E8; /* Lighter text for enhanced contrast */
            --accent-color: #66CCFF; /* Electric Blue accent */
            --border-color: rgba(255, 255, 255, 0.2); /* More visible, shimmering border */
            --console-bg: rgba(0, 0, 0, 0.995); /* Absolute black for console depth */
            --glitch-color: #FF00FF; /* Magenta for glitch */
            --warning-color: #FFD700; /* Gold */
            --critical-color: #FF4500; /* OrangeRed, more urgent */

            /* Stability Bar Colors */
            --stability-good: linear-gradient(90deg, #33FF33 0%, #00AA00 100%); /* Brighter green */
            --stability-warning: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            --stability-critical: linear-gradient(90deg, #FF4500 0%, #CC0000 100%); /* OrangeRed to Deeper Red */

            /* Data Stream & Protocol Status (Now Cognitive Stream) */
            --cognitive-stream-bg: rgba(0, 15, 25, 0.99); /* Deep ocean blue */
            --cognitive-stream-text: #00FFFF; /* Pure Cyan for data */
            --network-status-bg: rgba(10, 30, 50, 0.995); /* Darker, more opaque blue */
            --network-status-glow: rgba(0, 220, 255, 0.99); /* Stronger, electric blue glow */

            /* Resource & Module Selection (Re-purposed for Resource Displays) */
            --module-selection-bg: rgba(20, 5, 30, 0.99); /* Darker, deeper purple-ish */
            --module-selection-border: rgba(180, 0, 255, 0.9); /* Stronger purple accent */
            --module-selection-text: #EEDDFF; /* Lighter purple */
            --resource-bg: rgba(0, 0, 0, 0.98); /* Near black background for resource bars */

            /* Resource Specific Colors */
            --energy-color-high: linear-gradient(90deg, #FFFF33 0%, #FFCC00 100%); /* Brighter yellow */
            --energy-color-medium: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            --energy-color-low: linear-gradient(90deg, #FF0000 0%, #EE0000 100%); /* More intense red */

            --data-flow-color-high: linear-gradient(90deg, #00FF00 0%, #00CC00 100%);
            --data-flow-color-medium: linear-gradient(90deg, #00FFFF 0%, #00BFFF 100%);
            --data-flow-color-low: linear-gradient(90deg, #FF4500 0%, #DD0000 100%); /* More intense red */
            
            /* Gen 35.0 Colors (Updated from 34.0) */
            --signal-array-bg: rgba(5, 20, 35, 0.99); /* Deeper blue-grey */
            --signal-array-border: rgba(0, 220, 255, 0.9); /* Stronger electric blue accent */
            --signal-array-text: #C0EEF5; /* Lighter, more vibrant powder blue */
            --formulate-btn-glow: rgba(255, 50, 170, 0.99); /* Hotter Deep Pink for Architect button */

            /* Gen 35.0 resource: Raw Data */
            --raw-data-color-high: linear-gradient(90deg, #F06292 0%, #E91E63 100%);
            --raw-data-color-medium: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            --raw-data-color-low: linear-gradient(90deg, #B0BEC5 0%, #78909C 100%);
            --raw-data-text: #F06292;

            /* Gen 35.0 resource: Processing Power */
            --processing-power-color-high: linear-gradient(90deg, #D870DA 0%, #A020F0 100%); /* Orchid to Purple */
            --processing-power-color-medium: linear-gradient(90deg, #DA70D6 0%, #9932CC 100%);
            --processing-power-color-low: linear-gradient(90deg, #4B0082 0%, #191970 100%);
            --processing-power-text: #D870DA;

            /* NEW for Gen 35.0 resource: Exotic Matter (XM) */
            --exotic-matter-color-high: linear-gradient(90deg, #8AFFD0 0%, #32CD32 100%); /* Mint Green to Lime Green */
            --exotic-matter-color-medium: linear-gradient(90deg, #98FB98 0%, #ADFF2F 100%); /* PaleGreen to GreenYellow */
            --exotic-matter-color-low: linear-gradient(90deg, #FFD700 0%, #FFA500 100%); /* Gold to Orange */
            --exotic-matter-text: #8AFFD0; /* Mint Green */

            /* Gen 35.0 button: Calibrate Dimensional Link */
            --calibrate-btn-glow: rgba(120, 100, 230, 0.99); /* Softer Slate Blue Glow */
            --tune-btn-glow: rgba(0, 255, 0, 0.99);

            /* Gen 35.0 - Enhanced UI elements */
            --event-color: #FFA500;
            --event-text-shadow: 0 0 25px rgba(255, 165, 0, 1.0); /* Even stronger shadow */
            --info-color: #A080E0; /* Lighter Medium Purple */
            --info-text-shadow: 0 0 20px rgba(160, 128, 224, 0.9); /* Even stronger shadow */
            --log-glitch-color: #FF00FF;
            --header-underline-color: linear-gradient(90deg, transparent 2%, var(--accent-color) 50%, transparent 98%); /* Wider, more transparent edges */
            
            /* Gen 35.0 NEW: Optimize Pathways button */
            --refine-btn-glow: rgba(255, 255, 50, 0.99); /* Brighter Yellow glow for optimize */

            /* Gen 35.0 NEW: Anomaly Alert */
            --anomaly-color: #FF0000; /* Pure Red for critical */
            --anomaly-bg: rgba(255, 0, 0, 0.1); /* Even more semi-transparent Red */
            --anomaly-border: rgba(255, 0, 0, 0.9); /* Opaque Red */

            /* Gen 35.0 NEW: Adaptive Simulation Engine */
            --predictive-bg: rgba(5, 30, 20, 0.99); /* Deeper Green-Blue */
            --predictive-border: rgba(50, 255, 150, 0.9); /* Brighter Spring Green */
            --predictive-text: #B0FFC0; /* Lighter Mint Green */
            --predictive-btn-glow: rgba(50, 255, 150, 0.95);

            /* Gen 35.0 NEW: Evolutionary Sub-Routines Module */
            --augmentation-bg: rgba(30, 20, 5, 0.99); /* Deeper Orange-Brown */
            --augmentation-border: rgba(255, 180, 50, 0.9); /* Brighter Orange */
            --augmentation-text: #FFEB80; /* Brighter Gold */
            --augmentation-toggle-active: rgba(255, 180, 50, 0.95);
            --augmentation-toggle-inactive: rgba(120, 90, 10, 0.65);
            --augmentation-toggle-glow: rgba(255, 180, 50, 0.8);

            /* Gen 35.0 NEW: Dimensional Link Gateway (DLG) Module */
            --dlg-bg: rgba(15, 5, 35, 0.99); /* Deeper Purple */
            --dlg-border: rgba(220, 0, 255, 0.85); /* More vibrant Magenta-Purple */
            --dlg-text: #FFD0FF; /* Lighter Magenta */
            --dlg-btn-glow: rgba(220, 0, 255, 0.95);
            --dlg-card-active-border: rgba(255, 0, 255, 0.95);
            --dlg-card-active-shadow: rgba(255, 0, 255, 0.8);

            /* Gen 35.0 NEW: Matter-Energy Replicator (MER) Module */
            --mer-bg: rgba(35, 25, 5, 0.99); /* Deeper Gold-Brown */
            --mer-border: rgba(255, 220, 50, 0.95); /* Brighter Gold-Orange */
            --mer-text: #FFFF80; /* Bright Yellowish Gold */
            --mer-btn-glow: rgba(255, 220, 50, 0.95);

            /* Gen 35.0 NEW: Neural Network Blueprint (NNB) Module */
            --nnb-bg: rgba(10, 30, 30, 0.99); /* Deeper Teal */
            --nnb-border: rgba(50, 255, 255, 0.85); /* Brighter Cyan */
            --nnb-text: #80FFFF; /* Lighter Cyan */
            --nnb-component-bg: rgba(0, 0, 0, 0.75);
            --nnb-component-border: rgba(50, 255, 255, 0.6);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            background: #000000; /* Absolute black for base */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            font-size: 16px;
            line-height: 1.6;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24"><defs><filter id="f1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" /><feOffset dx="0" dy="0" result="offsetblur" /><feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs><path fill="%2300FFFF" filter="url(%23f1)" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path fill="%2300FFFF" d="M11 7h2v6h-2zM11 15h2v2h-2z"/><circle cx="12" cy="12" r="3.5" fill="%23FF00FF" filter="url(%23f1)"/><path fill="%2300FFFF" d="M12 0L8 8l-8 4 8 4 4 8 4-8 8-4-8-4zM12 24l-4-8 8-4-8-4-4-8-4 8-8 4 8 4z" filter="url(%23f1)"/></svg>') 50 50, auto; /* Larger, glowing cyan crosshair with magenta core and pulsing star points */
        }

        /* Dynamic Fluid Background - Layer 1 (More complex gradient, slower, deeper colors, more intricate rotation, more blur, exclusion blend) */
        body::before {
            content: '';
            position: absolute;
            top: -1000%; /* Even larger coverage */
            left: -1000%;
            width: 2100%;
            height: 2100%;
            background: linear-gradient(
                75deg, /* New angle */
                #000005 0%,
                #05000A 10%,
                #0A0010 20%,
                #0F0015 30%,
                #14001A 40%,
                #0F0015 50%,
                #0A0010 60%,
                #05000A 70%,
                #000005 80%,
                #05000A 90%,
                #000005 100%
            );
            background-size: 3000% 3000%; /* Even larger background for smoother animation */
            animation: fluidBackground1 1200s linear infinite alternate, rotateBackground 1800s linear infinite; /* Even longer animations */
            z-index: -3;
            filter: blur(1200px) opacity(0.999); /* Stronger blur, almost opaque */
            transform: rotate(-400deg) scale(9); /* Larger scale, more rotation */
            mix-blend-mode: exclusion; /* Deeper color interaction */
        }

        /* Dynamic Fluid Background - Layer 2 (Faster, more subtle, different direction, accent colors, more diffuse, soft-light blend) */
        body::after {
            content: '';
            position: absolute;
            top: -500%; /* Even larger coverage */
            left: -500%;
            width: 1100%;
            height: 1100%;
            background: linear-gradient(
                -180deg, /* Different angle */
                rgba(100, 200, 255, 0.8) 0%, /* primary glow accent */
                rgba(255, 120, 200, 0.75) 15%, /* secondary glow accent */
                rgba(80, 255, 80, 0.75) 30%, /* tertiary glow accent */
                rgba(0, 220, 255, 0.8) 45%, /* electric blue from DLG */
                rgba(255, 180, 50, 0.7) 60%, /* New orange accent from ESR */
                rgba(220, 0, 255, 0.7) 75%, /* Magenta from DLG */
                rgba(100, 200, 255, 0.8) 100%
            );
            background-size: 2000% 2000%; /* Even larger background for smoother animation */
            animation: fluidBackground2 800s ease-in-out infinite, rotateBackgroundReversed 1300s linear infinite; /* Even longer animations */
            z-index: -2;
            filter: blur(800px) opacity(0.995); /* Stronger blur, more opaque */
            mix-blend-mode: soft-light; /* Softer accenting */
            transform: rotate(250deg) scale(8); /* Larger scale, more rotation */
        }

        /* Micro-texture / Noise layer for overall subtle effect */
        html::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAMAAABg3Am1AAAAGXRFWHRTb2Z0d2FyZQBFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAABJURFRFNjY2ZmZmJCQkMDAwAAAA////CgB25wAAABxJRU5ErkJggg==') repeat;
            opacity: 0.65; /* More noticeable noise */
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: overlay; /* Overlay for subtle texture */
            filter: grayscale(0.3) contrast(1.3) brightness(1.3); /* Subtle color and contrast */
        }

        @keyframes fluidBackground1 {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        @keyframes fluidBackground2 {
            0% { background-position: 100% 0%; }
            100% { background-position: 0% 100%; }
        }

        @keyframes rotateBackground {
            from { transform: rotate(-400deg) scale(9); }
            to { transform: rotate(500deg) scale(9); }
        }

        @keyframes rotateBackgroundReversed {
            from { transform: rotate(250deg) scale(8); }
            to { transform: rotate(-650deg) scale(8); }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 2000px; /* Even wider for more content */
            padding: 180px; /* More padding */
            background: var(--frosted-bg);
            border: 1px solid var(--border-color);
            border-radius: 200px; /* Even more rounded */
            backdrop-filter: blur(700px) saturate(2500%) brightness(600%) contrast(1.5); /* Stronger blur, saturation, brightness, and contrast */
            -webkit-backdrop-filter: blur(700px) saturate(2500%) brightness(600%) contrast(1.5);
            box-shadow:
                0 200px 900px rgba(0, 0, 0, 0.999), /* Deeper shadow */
                0 0 900px var(--primary-glow), /* Stronger outer glow */
                inset 0 0 250px rgba(255, 255, 255, 0.7), /* Stronger inner glow for depth */
                inset 0 0 400px var(--primary-glow); /* Even more inner glow */
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 180px; /* Increased gap between sections */
            animation: fadeInScale 12s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; /* Longer, smoother animation */
            transition: all 4s ease-out; /* Smooth transitions for potential dynamic changes */
            transform-style: preserve-3d; /* For subtle 3D effects */
        }

        .container::before { /* Animated border glow */
            content: '';
            position: absolute;
            inset: -60px; /* More overflow */
            border-radius: 202px;
            background: linear-gradient(45deg, #00FFFF, #FF00FF, #FFFF00, #A020F0, #00FFFF, #D870DA, #FF1493, #00FF00, #F06292, #FFA500, #8AFFD0, #FFD700); /* Even more vibrant border glow colors, includes new processing power color, orange, and exotic matter green */
            background-size: 2500% 2500%; /* Larger background for smoother animation */
            animation: borderGlow 90s linear infinite alternate; /* Slower animation */
            filter: blur(120px); /* Stronger blur */
            z-index: -1;
            opacity: 0.999; /* Stronger glow */
            mix-blend-mode: screen; /* Additive glow */
        }

        @keyframes borderGlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.05) translateY(800px) perspective(10000px) rotateX(100deg) rotateY(25deg); }
            to { opacity: 1; transform: scale(1) translateY(0) perspective(10000px) rotateX(0deg) rotateY(0deg); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 9em; /* Even larger heading */
            color: var(--accent-color);
            text-shadow: 0 0 160px var(--primary-glow), 0 0 220px rgba(100, 200, 255, 0.99), 0 0 250px rgba(100, 200, 255, 0.85);
            margin-bottom: 140px;
            letter-spacing: 30px;
            line-height: 1.1;
            position: relative;
            transform: translateZ(120px); /* Lift heading slightly in 3D space */
        }

        h1::after { /* Underline effect */
            content: '';
            position: absolute;
            bottom: -90px;
            left: 50%;
            transform: translateX(-50%);
            width: 180%; /* Wider underline */
            height: 20px; /* Thicker underline */
            background: var(--header-underline-color);
            box-shadow: 0 0 100px var(--primary-glow);
        }

        p {
            margin: 0;
            font-weight: 300;
            color: var(--text-color);
            opacity: 0.99;
            font-size: 2.2em; /* Larger paragraph text */
            transform: translateZ(70px);
        }

        .control-module {
            display: flex;
            flex-direction: column;
            gap: 150px; /* Increased gap */
            margin: 100px 0;
            position: relative;
        }

        /* Module base styles */
        .dlg-module, .mer-module, .adaptive-simulation-engine, .evolutionary-sub-routines, .nnb-module { /* NEW MODULE ADDED */
            display: flex;
            flex-direction: column;
            gap: 70px;
            text-align: left;
            padding: 80px;
            border-radius: 70px;
            border: 1px solid var(--signal-array-border); /* Default border, will be overridden */
            box-shadow: inset 0 0 70px rgba(0, 220, 255, 0.8), 0 0 70px rgba(0, 220, 255, 0.7), inset 0 0 130px rgba(0, 220, 255, 0.4); /* More inner shadow */

            transform: translateZ(60px);

        }
        /* Specific overrides for new modules */
        .dlg-module {
            background: var(--dlg-bg);
            border-color: var(--dlg-border);
            box-shadow: inset 0 0 70px rgba(220, 0, 255, 0.85), 0 0 70px rgba(220, 0, 255, 0.75), inset 0 0 130px rgba(220, 0, 255, 0.45);
        }
        .mer-module {
            background: var(--mer-bg);
            border-color: var(--mer-border);
            box-shadow: inset 0 0 70px rgba(255, 220, 50, 0.85), 0 0 70px rgba(255, 220, 50, 0.75), inset 0 0 130px rgba(255, 220, 50, 0.45);
        }
        .adaptive-simulation-engine {
            background: var(--predictive-bg);
            border-color: var(--predictive-border);
            box-shadow: inset 0 0 70px rgba(50, 255, 150, 0.85), 0 0 70px rgba(50, 255, 150, 0.75), inset 0 0 130px rgba(50, 255, 150, 0.45);
        }
        .evolutionary-sub-routines {
            background: var(--augmentation-bg);
            border-color: var(--augmentation-border);

        }
        .nnb-module { /* NEW */
            background: var(--nnb-bg);
            border-color: var(--nnb-border);
            box-shadow: inset 0 0 70px rgba(50, 255, 255, 0.85), 0 0 70px rgba(50, 255, 255, 0.75), inset 0 0 130px rgba(50, 255, 255, 0.45);
        }

        .dlg-module::after, .mer-module::after, .adaptive-simulation-engine::after, .evolutionary-sub-routines::after, .nnb-module::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.3) 0%, transparent 60%); /* Stronger glare */
            mix-blend-mode: overlay;
            pointer-events: none;
            opacity: 0.995;
        }


        .dlg-module::before, .mer-module::before, .adaptive-simulation-engine::before, .evolutionary-sub-routines::before, .nnb-module::before { /* NEW MODULE ADDED */
            content: attr(data-label);

            top: -60px; /* Slightly higher */

            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 4px;
            transform: translateY(-50%) translateZ(40px); /* Lift more */
            opacity: 0.995;
            border: 1px solid var(--signal-array-text); /* Default border, will be overridden */
            box-shadow: 0 0 40px var(--signal-array-text); /* Stronger glow */
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }
        /* Specific overrides for new modules before pseudo-elements */
        .dlg-module::before {
            color: var(--dlg-text);
            border-color: var(--dlg-text);
            box-shadow: 0 0 40px var(--dlg-text);
        }

            color: var(--mer-text);
            border-color: var(--mer-text);

        .adaptive-simulation-engine::before {

        }

        }

            border-color: var(--nnb-text);
            box-shadow: 0 0 40px var(--nnb-text);
        }

            margin-bottom: 60px;
        }

            font-family: 'Orbitron', sans-serif;
