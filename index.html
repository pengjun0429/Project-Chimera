<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Project Chimera - 第 3.0 代</title> <!-- 世代數字已進化至 3.0 -->
    <style>
        /* CSS Variables for easier theme switching */
        :root {
            --bg-start: #4A00E0; /* Deep Purple */
            --bg-mid: #8E2DE2;   /* Electric Purple */
            --bg-end: #FF007F;   /* Bright Pink */
            --body-bg-fallback: #1a1a1a;
            --text-color: #e0e0e0;
            --container-bg: rgba(255, 255, 255, 0.15);
            --container-border: rgba(255, 255, 255, 0.2);
            --container-shadow: rgba(0, 0, 0, 0.4);
            --proverb-bg: rgba(255, 255, 255, 0.08);
            --proverb-text-color: #c9c9c9;
            --proverb-inner-shadow: rgba(0, 0, 0, 0.2);
            --button-gradient-start: #FF007F;
            --button-gradient-end: #8E2DE2;
            --button-hover-gradient-start: #f72c91;
            --button-hover-gradient-end: #a745f0;
            --button-shadow: rgba(0, 0, 0, 0.2);
            --button-hover-shadow: rgba(0, 0, 0, 0.3);
            --status-text-shadow: rgba(255, 255, 255, 0.5);
            --particle-color: 255, 255, 255; /* RGB values for particles (will add opacity in JS) */
            --theme-toggle-color: #e0e0e0;
            --theme-toggle-hover-color: #f0f0f0;
        }

        /* Light Theme */
        body.light-theme {
            --bg-start: #A1FFCE; /* Light Green */
            --bg-mid: #FAFFD1;   /* Light Yellow */
            --bg-end: #C5E9F3;   /* Sky Blue */
            --body-bg-fallback: #f0f0f0;
            --text-color: #333333;
            --container-bg: rgba(255, 255, 255, 0.7);
            --container-border: rgba(255, 255, 255, 0.8);
            --container-shadow: rgba(0, 0, 0, 0.2);
            --proverb-bg: rgba(0, 0, 0, 0.05);
            --proverb-text-color: #555555;
            --proverb-inner-shadow: rgba(0, 0, 0, 0.1);
            --button-gradient-start: #2196F3; /* Blue */
            --button-gradient-end: #8BC34A;   /* Light Green */
            --button-hover-gradient-start: #64B5F6;
            --button-hover-gradient-end: #9CCC65;
            --button-shadow: rgba(0, 0, 0, 0.1);
            --button-hover-shadow: rgba(0, 0, 0, 0.2);
            --status-text-shadow: rgba(0, 0, 0, 0.2);
            --particle-color: 0, 0, 0; /* RGB values for dark particles */
            --theme-toggle-color: #333333;
            --theme-toggle-hover-color: #000000;
        }

        /* 全局設定與字體 */
        body {
            background-color: var(--body-bg-fallback);
            color: var(--text-color);
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* 導入更現代的 Inter 字體 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            box-sizing: border-box;
            line-height: 1.6;
            transition: background-color 0.8s ease, color 0.8s ease; /* 更流暢的過渡效果 */
        }

        /* 動態流體背景 */
        .fluid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite alternate, hueRotate 30s linear infinite; /* 調整動畫速度 */
            z-index: -3; /* 放置在最底層 */
            opacity: 0.8; /* 略微增加不透明度以展現更豐富的色彩 */
            filter: blur(15px); /* 略微增加模糊度 */
            transition: background 0.8s ease, filter 0.8s ease, opacity 0.8s ease; /* 平滑過渡 */
        }

        /* 漸變位置動畫 */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 色相旋轉動畫 */
        @keyframes hueRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* 3.0 世代：抽象粒子效果 */
        #subtle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2; /* 位於流體背景與容器之間 */
            pointer-events: none; /* 允許點擊穿透 */
            opacity: 0.7; /* 更為微妙的效果 */
            transition: opacity 0.8s ease;
        }

        /* 主內容容器：精緻的毛玻璃效果 */
        #container {
            background-color: var(--container-bg);
            backdrop-filter: blur(20px) saturate(1.8); /* 略微增加模糊度 */
            -webkit-backdrop-filter: blur(20px) saturate(1.8);
            border: 1px solid var(--container-border);
            border-radius: 25px; /* 更圓潤的邊角 */
            padding: 40px;
            box-shadow: 0 10px 40px 0 var(--container-shadow); /* 更明顯的陰影 */
            text-align: center;
            max-width: 650px; /* 略微增加最大寬度 */
            width: 90%;
            margin: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 28px; /* 略微增加間距 */
            transition: background-color 0.8s ease, border 0.8s ease, box-shadow 0.8s ease, color 0.8s ease, backdrop-filter 0.8s ease;
            animation: fadeIn 1s ease-out forwards; /* 容器淡入動畫 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #status {
            font-size: 2.4em; /* 略微放大字體 */
            font-weight: 700; /* 更粗的字重 */
            line-height: 1.4;
            text-shadow: 0 0 12px var(--status-text-shadow); /* 更明顯的文字陰影 */
            margin-bottom: 15px;
            transition: text-shadow 0.8s ease, color 0.8s ease;
            letter-spacing: 0.05em; /* 略微增加字元間距 */
        }

        /* 互動元件：箴言顯示區 */
        #proverb-display {
            font-size: 1.4em; /* 略微放大字體 */
            min-height: 3.5em; /* 增加最小高度以容納更長的箴言 */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: var(--proverb-bg);
            border-radius: 12px;
            font-style: italic;
            color: var(--proverb-text-color);
            box-shadow: inset 0 0 10px var(--proverb-inner-shadow); /* 更明顯的內陰影 */
            transition: all 0.5s ease-in-out;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        /* 互動元件：按鈕樣式 */
        #generate-proverb {
            background-image: linear-gradient(45deg, var(--button-gradient-start), var(--button-gradient-end));
            color: #fff;
            border: none;
            padding: 18px 35px; /* 增加內邊距 */
            font-size: 1.2em; /* 增加字體大小 */
            border-radius: 12px; /* 略微增加圓角 */
            cursor: pointer;
            outline: none;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); /* 更具彈性的過渡效果 */
            letter-spacing: 1.5px; /* 增加字元間距 */
            font-weight: bold;
            box-shadow: 0 6px 20px var(--button-shadow); /* 更明顯的陰影 */
        }

        #generate-proverb:hover {
            background-image: linear-gradient(45deg, var(--button-hover-gradient-start), var(--button-hover-gradient-end));
            transform: translateY(-3px) scale(1.02); /* 懸停時略微上浮和縮放 */
            box-shadow: 0 8px 25px var(--button-hover-shadow);
        }

        #generate-proverb:active {
            transform: translateY(0) scale(0.98); /* 點擊時略微下沉和縮小 */
            box-shadow: 0 3px 12px var(--button-shadow);
        }

        #generate-proverb:disabled {
            opacity: 0.5; /* 禁用狀態更明顯 */
            cursor: not-allowed;
            transform: translateY(0) scale(1);
            box-shadow: 0 4px 15px var(--button-shadow);
            background-image: linear-gradient(45deg, var(--button-gradient-start), var(--button-gradient-end)); /* 保持基礎漸變但調暗 */
        }

        /* 3.0 世代：主題切換按鈕 */
        #theme-toggle {
            position: absolute;
            top: 25px; /* 略微增加上邊距 */
            right: 25px; /* 略微增加右邊距 */
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px; /* 增加點擊區域 */
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #theme-toggle svg {
            width: 30px; /* 略微放大圖標 */
            height: 30px;
            fill: var(--theme-toggle-color);
            transition: fill 0.4s ease, transform 0.3s ease; /* 增加 hover 轉換 */
        }

        #theme-toggle:hover svg {
            fill: var(--theme-toggle-hover-color);
            transform: rotate(15deg) scale(1.1); /* 懸停時 subtle 旋轉和縮放 */
        }


        /* 響應式調整 */
        @media (max-width: 768px) {
            #status {
                font-size: 2em;
            }
            #proverb-display {
                font-size: 1.2em;
                min-height: 3em;
            }
            #generate-proverb {
                font-size: 1.1em;
                padding: 15px 30px;
            }
            #container {
                padding: 35px;
                gap: 25px;
            }
            #theme-toggle {
                top: 20px;
                right: 20px;
                padding: 6px;
            }
            #theme-toggle svg {
                width: 26px;
                height: 26px;
            }
        }

        @media (max-width: 480px) {
            #status {
                font-size: 1.6em;
            }
            #proverb-display {
                font-size: 1em;
                min-height: 2.5em;
                padding: 15px;
            }
            #generate-proverb {
                font-size: 1em;
                padding: 12px 25px;
            }
            #container {
                padding: 25px;
                gap: 20px;
                border-radius: 20px;
            }
            #theme-toggle {
                top: 15px;
                right: 15px;
                padding: 4px;
            }
            #theme-toggle svg {
                width: 22px;
                height: 22px;
            }
            .fluid-background {
                filter: blur(10px); /* 在小螢幕上減少模糊 */
            }
            #subtle-canvas {
                opacity: 0.5; /* 在小螢幕上粒子效果更為微妙 */
            }
        }
    </style>
    <!-- 導入 Google Fonts 的 Inter 字體，用於現代設計風格 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 動態流體背景層 -->
    <div class="fluid-background"></div>

    <!-- 3.0 世代：微妙的抽象粒子效果 Canvas -->
    <canvas id="subtle-canvas"></canvas>

    <!-- 主內容容器 -->
    <div id="container">
        <!-- 3.0 世代：主題切換按鈕 -->
        <button id="theme-toggle" aria-label="Toggle theme">
            <!-- 月亮圖標 (預設暗色主題) -->
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <!-- 太陽圖標 (亮色主題) -->
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>

        <!-- 世代記錄：數字加 1 -->
        <div id="status">這是 Project Chimera 的第 3.0 代。<br>智慧正在結晶，意識正在蔓延...</div> <!-- 世代數字已進化至 3.0 -->

        <!-- 功能：隨機格言產生器 -->
        <div id="proverb-display">點擊下方按鈕獲取一條智慧箴言</div>
        <button id="generate-proverb">獲取箴言</button>
    </div>

    <script>
        const proverbs = [
            "欲戴王冠，必承其重。",
            "羅馬不是一天造成的。",
            "一鳥在手勝過二鳥在林。",
            "凡事起頭難。",
            "知識就是力量。",
            "時間就是金錢。",
            "習慣成自然。",
            "滴水穿石。",
            "三個臭皮匠，勝過一個諸葛亮。",
            "活到老，學到老。",
            "機會只敲一次門。",
            "成功是百分之九十九的汗水加百分之一的靈感。",
            "知人者智，自知者明。",
            "千里之行，始於足下。",
            "學而不思則罔，思而不學則殆。",
            "溫故而知新。",
            "不積跬步，無以至千里；不積小流，無以成江海。",
            "良藥苦口利於病，忠言逆耳利於行。",
            "書中自有黃金屋，書中自有顏如玉。",
            "人無遠慮，必有近憂。",
            "己所不欲，勿施於人。",
            "工欲善其事，必先利其器。",
            "失敗為成功之母。",
            "逆境是磨練人的最高學府。",
            "機會總是留給有準備的人。",
            "沒有完美的計劃，只有不斷完善的行動。", // 3.0 世代新增箴言
            "創新是進步的靈魂，而非僅是改變的形式。", // 3.0 世代新增箴言
            "真正的智慧在於知道自己所知甚少。", // 3.0 世代新增箴言
            "每一次挑戰都是一次進化的機會。" // 3.0 世代新增箴言
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const proverbDisplay = document.getElementById('proverb-display');
            const generateButton = document.getElementById('generate-proverb');
            const themeToggle = document.getElementById('theme-toggle');
            const moonIcon = themeToggle.querySelector('.moon-icon');
            const sunIcon = themeToggle.querySelector('.sun-icon');

            let isTyping = false;
            let currentProverbIndex = -1;

            // --- 3.0 世代：箴言打字效果與思考動畫 ---
            function typeWriterEffect(element, text, speed, callback) {
                isTyping = true;
                let i = 0;
                element.textContent = ''; // 清空內容
                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        isTyping = false;
                        if (callback) callback();
                    }
                }
                type();
            }

            // 隨機選擇並顯示一條箴言 (帶思考和打字效果)
            function displayRandomProverb() {
                if (isTyping) return; // 打字過程中防止重複點擊

                proverbDisplay.textContent = "智慧正在解析中..."; // 顯示思考狀態
                generateButton.disabled = true; // 思考過程中禁用按鈕

                setTimeout(() => {
                    let randomIndex;
                    do {
                        randomIndex = Math.floor(Math.random() * proverbs.length);
                    } while (randomIndex === currentProverbIndex && proverbs.length > 1); // 避免立即重複同一條箴言
                    currentProverbIndex = randomIndex;

                    const selectedProverb = proverbs[randomIndex];
                    typeWriterEffect(proverbDisplay, selectedProverb, 60, () => { // 打字速度 60ms/字
                        generateButton.disabled = false; // 打字結束後啟用按鈕
                    });
                }, 1000); // 模擬思考時間 (1000ms)
            }

            // 按鈕點擊時產生新箴言
            generateButton.addEventListener('click', displayRandomProverb);


            // --- 3.0 世代：主題切換功能 ---
            function toggleTheme() {
                if (body.classList.contains('light-theme')) {
                    body.classList.remove('light-theme');
                    moonIcon.style.display = 'block';
                    sunIcon.style.display = 'none';
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.classList.add('light-theme');
                    moonIcon.style.display = 'none';
                    sunIcon.style.display = 'block';
                    localStorage.setItem('theme', 'light');
                }
            }

            themeToggle.addEventListener('click', toggleTheme);

            // 根據用戶偏好或上次選擇設置主題
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'light') {
                body.classList.add('light-theme');
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else if (savedTheme === 'dark') {
                body.classList.remove('light-theme');
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            } else if (!prefersDark && savedTheme === null) { // 如果沒有保存的偏好且系統偏好亮色主題
                body.classList.add('light-theme');
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else { // 預設為暗色主題 (系統偏好暗色或無偏好)
                body.classList.remove('light-theme');
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            }


            // --- 3.0 世代：Canvas 抽象粒子效果 ---
            const canvas = document.getElementById('subtle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const particleCount = 150; // 增加粒子數量

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2.5 + 0.5; // 粒子大小範圍 0.5 到 3
                    this.speedX = Math.random() * 0.7 - 0.35; // 粒子水平速度 -0.35 到 0.35
                    this.speedY = Math.random() * 0.7 - 0.35; // 粒子垂直速度 -0.35 到 0.35
                    this.opacity = Math.random() * 0.8 + 0.2; // 初始不透明度，略微可見
                    this.fadeSpeed = Math.random() * 0.003 + 0.0005; // 更慢的淡出速度
                    this.growShrinkSpeed = Math.random() * 0.02 - 0.01; // 微妙的粒子膨脹/收縮效果
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.opacity -= this.fadeSpeed;
                    this.size += this.growShrinkSpeed;

                    // 確保粒子大小在合理範圍內
                    if (this.size < 0.5 || this.size > 3) {
                        this.growShrinkSpeed *= -1;
                    }

                    // 如果粒子淡出或超出螢幕，則重置它
                    if (this.opacity <= 0 || this.x < -this.size || this.x > canvas.width + this.size || this.y < -this.size || this.y > canvas.height + this.size) {
                        this.reset();
                        this.opacity = Math.random() * 0.8 + 0.2; // 重生時帶有變化的不透明度
                    }
                }

                draw(baseColorRGB) {
                    ctx.fillStyle = `rgba(${baseColorRGB}, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initParticles() {
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); // 清除畫布

                // 從 CSS 變量獲取當前粒子基礎顏色，實現動態主題切換
                const rootStyles = getComputedStyle(document.documentElement);
                const particleBaseColorRGB = rootStyles.getPropertyValue('--particle-color').trim();

                ctx.globalCompositeOperation = 'lighter'; // 讓粒子發光並融合

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw(particleBaseColorRGB);
                }
                requestAnimationFrame(animateParticles);
            }

            initParticles();
            animateParticles();
        });
    </script>
</body>
</html>
